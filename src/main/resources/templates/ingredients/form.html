<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${ingredient.ingredientId != null} ? 'Zutat bearbeiten' : 'Neue Zutat'">Zutat</title>
</head>
<body>
<section th:fragment="content">
    <h1 th:text="${ingredient.ingredientId != null} ? 'Zutat bearbeiten' : 'Neue Zutat'">Zutat</h1>

    <form th:action="@{/ingredients/save}" method="post" class="mt-3" style="max-width: 500px;">
        <input type="hidden" name="ingredientId" th:value="${ingredient.ingredientId}"/>

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" name="name" class="form-control"
                   th:value="${ingredient.name}" required/>
        </div>

        <div class="mb-3">
            <label for="availableAmount" class="form-label">Bestand</label>
            <input type="number" id="availableAmount" name="availableAmount" class="form-control"
                   th:value="${ingredient.availableAmount}" step="0.01" min="0" required/>
        </div>

        <div class="mb-3">
            <label for="unit" class="form-label">Einheit</label>
            <input type="text" id="unit" name="unit" class="form-control"
                   th:value="${ingredient.unit}" placeholder="z.B. g, ml, Stück" required/>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Speichern</button>
            <a th:href="@{/ingredients}" class="btn btn-outline-secondary">Zurück</a>
        </div>
    </form>
</section>
</body>
</html>
