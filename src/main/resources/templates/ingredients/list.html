<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Zutaten</title>
</head>
<body>
<section th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Zutaten</h1>
        <a th:href="@{/ingredients/new}" class="btn btn-primary">+ Neue Zutat</a>
    </div>

    <table class="table table-striped" th:if="${not #lists.isEmpty(ingredients)}">
        <thead>
            <tr>
                <th>Name</th>
                <th>Bestand</th>
                <th>Einheit</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ingredient : ${ingredients}">
                <td th:text="${ingredient.name}"></td>
                <td th:text="${ingredient.availableAmount}"></td>
                <td th:text="${ingredient.unit}"></td>
                <td class="text-end">
                    <a th:href="@{/ingredients/{id}/edit(id=${ingredient.ingredientId})}"
                       class="btn btn-sm btn-outline-secondary">Bearbeiten</a>
                    <form th:action="@{/ingredients/{id}/delete(id=${ingredient.ingredientId})}"
                          method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Zutat wirklich löschen?')">Löschen</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(ingredients)}" class="text-muted">Noch keine Zutaten vorhanden.</p>
</section>
</body>
</html>
