<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${recipe.recipeId != null} ? 'Edit Recipe' : 'New Recipe'">Recipe</title>
</head>
<body>
<section th:fragment="content">
    <h1 th:text="${recipe.recipeId != null} ? 'Edit Recipe' : 'New Recipe'">Recipe</h1>

    <form th:action="@{/recipes/save}" method="post" class="mt-3" style="max-width: 700px;">
        <input type="hidden" name="recipeId" th:value="${recipe.recipeId}"/>

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" name="name" class="form-control"
                   th:value="${recipe.name}" required/>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" id="description" name="description" class="form-control"
                   th:value="${recipe.description}"/>
        </div>

        <div class="mb-3">
            <label for="instructions" class="form-label">Instructions</label>
            <textarea id="instructions" name="instructions" class="form-control" rows="4"
                      th:text="${recipe.instructions}"></textarea>
        </div>

        <div class="mb-3">
            <label for="portions" class="form-label">Portions</label>
            <input type="number" id="portions" name="portions" class="form-control"
                   th:value="${recipe.portions}" min="1" required style="max-width: 120px;"/>
        </div>

        <!-- Ingredients -->
        <div class="mb-3">
            <label class="form-label fw-bold">Ingredients</label>
            <table class="table table-sm" id="ingredientTable">
                <thead>
                    <tr>
                        <th>Ingredient</th>
                        <th>Amount</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="ingredientRows">
                    <!-- existing rows when editing -->
                    <tr th:each="ri : ${recipe.recipeIngredients}">
                        <td>
                            <select name="ingredientIds" class="form-select form-select-sm">
                                <option th:each="ing : ${allIngredients}"
                                        th:value="${ing.ingredientId}"
                                        th:text="${ing.name} + ' (' + ${ing.unit} + ')'"
                                        th:selected="${ing.ingredientId == ri.ingredient.ingredientId}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <input type="number" name="requiredAmounts" class="form-control form-control-sm"
                                   th:value="${ri.requiredAmount}" step="0.01" min="0.01" required/>
                        </td>
                        <td>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    onclick="this.closest('tr').remove()">✕</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="addIngredientRow()">
                + Add Ingredient
            </button>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/recipes}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>

    <!-- ingredient options for JS -->
    <script th:inline="javascript">
        const allIngredients = /*[[${allIngredients}]]*/ [];

        function addIngredientRow() {
            const tbody = document.getElementById('ingredientRows');
            const tr = document.createElement('tr');

            let options = allIngredients.map(ing =>
                `<option value="${ing.ingredientId}">${ing.name} (${ing.unit})</option>`
            ).join('');

            tr.innerHTML = `
                <td>
                    <select name="ingredientIds" class="form-select form-select-sm">
                        ${options}
                    </select>
                </td>
                <td>
                    <input type="number" name="requiredAmounts" class="form-control form-control-sm"
                           step="0.01" min="0.01" required/>
                </td>
                <td>
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            onclick="this.closest('tr').remove()">✕</button>
                </td>`;
            tbody.appendChild(tr);
        }
    </script>
</section>
</body>
</html>
