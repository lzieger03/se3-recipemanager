<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${recipe.recipeId != null} ? 'Rezept bearbeiten' : 'Neues Rezept'">Rezept</title>
</head>
<body>
<section th:fragment="content">
    <h1 th:text="${recipe.recipeId != null} ? 'Rezept bearbeiten' : 'Neues Rezept'">Rezept</h1>

    <form th:action="@{/recipes/save}" method="post" class="mt-3" style="max-width: 700px;">
        <input type="hidden" name="recipeId" th:value="${recipe.recipeId}"/>

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" name="name" class="form-control"
                   th:value="${recipe.name}" required/>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Beschreibung</label>
            <input type="text" id="description" name="description" class="form-control"
                   th:value="${recipe.description}"/>
        </div>

        <div class="mb-3">
            <label for="instructions" class="form-label">Zubereitung</label>
            <textarea id="instructions" name="instructions" class="form-control" rows="4"
                      th:text="${recipe.instructions}"></textarea>
        </div>

        <div class="mb-3">
            <label for="portions" class="form-label">Portionen</label>
            <input type="number" id="portions" name="portions" class="form-control"
                   th:value="${recipe.portions}" min="1" required style="max-width: 120px;"/>
        </div>

        <!-- Ingredients -->
        <div class="mb-3">
            <label class="form-label fw-bold">Zutaten</label>
            <small class="text-muted d-block mb-2">Neue Zutaten einfach eintippen — werden automatisch angelegt.</small>

            <!-- datalist with existing ingredient names for autocomplete -->
            <datalist id="ingredients-datalist">
                <option th:each="ing : ${allIngredients}"
                        th:value="${ing.name}"
                        th:label="${ing.unit}">
                </option>
            </datalist>

            <table class="table table-sm" id="ingredientTable">
                <thead>
                    <tr>
                        <th>Zutat</th>
                        <th style="width:110px">Einheit</th>
                        <th style="width:110px">Menge</th>
                        <th style="width:40px"></th>
                    </tr>
                </thead>
                <tbody id="ingredientRows">
                    <!-- existing rows when editing -->
                    <tr th:each="ri : ${recipe.recipeIngredients}">
                        <td>
                            <input type="text" name="ingredientNames" class="form-control form-control-sm"
                                   list="ingredients-datalist"
                                   th:value="${ri.ingredient.name}"
                                   placeholder="z.B. Mehl"
                                   autocomplete="off"
                                   oninput="autofillUnit(this)" required/>
                        </td>
                        <td>
                            <input type="text" name="ingredientUnits" class="form-control form-control-sm"
                                   th:value="${ri.ingredient.unit}"
                                   placeholder="g"/>
                        </td>
                        <td>
                            <input type="number" name="requiredAmounts" class="form-control form-control-sm"
                                   th:value="${ri.requiredAmount}" step="0.01" min="0.01" required/>
                        </td>
                        <td>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    onclick="this.closest('tr').remove()">✕</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="addIngredientRow()">
                + Zutat hinzufügen
            </button>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Speichern</button>
            <a th:href="@{/recipes}" class="btn btn-outline-secondary">Zurück</a>
        </div>
    </form>

    <script>
        // build map from already-rendered datalist — no Hibernate serialization needed
        const ingredientUnitMap = {};
        document.querySelectorAll('#ingredients-datalist option').forEach(opt => {
            ingredientUnitMap[opt.value.toLowerCase()] = opt.label;
        });

        function autofillUnit(nameInput) {
            const unit = ingredientUnitMap[nameInput.value.trim().toLowerCase()];
            if (unit) {
                const row = nameInput.closest('tr');
                const unitInput = row.querySelector('input[name="ingredientUnits"]');
                if (unitInput) unitInput.value = unit;
            }
        }

        function addIngredientRow() {
            const tbody = document.getElementById('ingredientRows');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <input type="text" name="ingredientNames" class="form-control form-control-sm"
                           list="ingredients-datalist" placeholder="z.B. Mehl"
                           autocomplete="off" oninput="autofillUnit(this)" required/>
                </td>
                <td>
                    <input type="text" name="ingredientUnits" class="form-control form-control-sm"
                           placeholder="g"/>
                </td>
                <td>
                    <input type="number" name="requiredAmounts" class="form-control form-control-sm"
                           step="0.01" min="0.01" required/>
                </td>
                <td>
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            onclick="this.closest('tr').remove()">✕</button>
                </td>`;
            tbody.appendChild(tr);
            tr.querySelector('input[name="ingredientNames"]').focus();
        }
    </script>
</section>
</body>
</html>
